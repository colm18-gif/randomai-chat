<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departures — AI Flight Deck</title>
<meta name="description" content="Press the button. Get sent to a random AI. That's the whole site.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg-base: #182232;
    --board-bg: #212e40;
    --board-border: #33435b;
    --flap-top: #2e3e56;
    --flap-bottom: #243246;
    --flap-line: #141c29;
    
    --amber: #ffb800;
    --amber-glow: rgba(255, 184, 0, 0.3);
    --cyan: #38bdf8;
    --cyan-glow: rgba(56, 189, 248, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg-base);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12), transparent 60%),
      radial-gradient(circle at 50% 100%, rgba(255, 184, 0, 0.08), transparent 70%),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 4px;
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .stage {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 4px 12px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.2em;
    color: var(--text-main);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  .tagline {
    margin: 0 0 32px;
    font-size: 15px;
    color: var(--text-muted);
    max-width: 440px;
  }

  /* ---------------------------------------------------------- Split Flap Board */

  .board {
    background: var(--board-bg);
    border: 1px solid var(--board-border);
    border-radius: 12px;
    padding: 28px 24px 20px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 20px 40px -10px rgba(10, 16, 26, 0.5),
      0 0 25px rgba(56, 189, 248, 0.05);
    position: relative;
    width: 100%;
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .board-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .board-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .flap-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    perspective: 400px;
  }

  .flap-cell {
    position: relative;
    width: 44px;
    height: 60px;
    background: linear-gradient(180deg, var(--flap-top) 0%, var(--flap-bottom) 100%);
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .flap-cell::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: var(--flap-line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    z-index: 3;
  }

  .flap-cell .char {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 32px;
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber-glow);
    line-height: 1;
    backface-visibility: hidden;
  }

  .flap-cell.flipping .char {
    animation: flip3D 0.12s ease-in-out;
  }

  @keyframes flip3D {
    0%   { transform: rotateX(0deg); filter: brightness(1); }
    50%  { transform: rotateX(-90deg); filter: brightness(0.7); }
    100% { transform: rotateX(0deg); filter: brightness(1.15); }
  }

  .flap-cell.settled .char {
    animation: settleGlow 0.4s ease-out;
  }

  @keyframes settleGlow {
    0%   { color: #ffffff; text-shadow: 0 0 16px #ffffff; }
    100% { color: var(--amber); text-shadow: 0 0 10px var(--amber-glow); }
  }

  .board-caption {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    min-height: 18px;
  }

  .board-caption .name {
    color: var(--cyan);
    font-weight: 700;
    text-shadow: 0 0 8px var(--cyan-glow);
  }

  /* ---------------------------------------------------------- Action Controls */

  .action {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  .go-btn {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #141c29;
    background: linear-gradient(135deg, var(--amber) 0%, #e5a400 100%);
    border: none;
    padding: 18px 42px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 
      0 6px 0 #b38000, 
      0 12px 20px rgba(255, 184, 0, 0.2);
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    top: 0;
  }

  .go-btn:hover {
    filter: brightness(1.08);
    box-shadow: 
      0 6px 0 #b38000, 
      0 15px 25px rgba(255, 184, 0, 0.3);
  }

  .go-btn:active {
    top: 4px;
    box-shadow: 
      0 2px 0 #b38000, 
      0 5px 10px rgba(255, 184, 0, 0.15);
  }

  .go-btn:disabled {
    cursor: not-allowed;
    filter: grayscale(0.5);
    opacity: 0.8;
    top: 2px;
    box-shadow: 0 4px 0 #b38000;
  }

  .go-btn:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 4px;
  }

  .fallback-link {
    font-size: 13.5px;
    color: var(--text-muted);
    min-height: 20px;
  }

  .fallback-link a {
    color: var(--cyan);
    text-decoration: none;
    font-weight: 500;
    border-bottom: 1px dashed var(--cyan);
    transition: border 0.2s ease;
  }

  .fallback-link a:hover { 
    border-bottom-style: solid; 
  }

  .tally {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ---------------------------------------------------------- Pool Disclosure */

  details.pool {
    margin-top: 36px;
    width: 100%;
    max-width: 480px;
    background: rgba(33, 46, 64, 0.5);
    border: 1px solid var(--board-border);
    border-radius: 8px;
    padding: 12px 16px;
    transition: background 0.2s;
  }

  details.pool[open] {
    background: rgba(33, 46, 64, 0.85);
  }

  details.pool summary {
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  details.pool summary:hover { color: var(--text-main); }

  details.pool summary::after {
    content: '↓';
    font-size: 11px;
    transition: transform 0.2s;
  }

  details.pool[open] summary::after {
    transform: rotate(180deg);
  }

  .pool-grid {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .pool-grid span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 4px 10px;
    border-radius: 4px;
  }

  footer {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--board-border);
    padding: 6px 14px;
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .contact-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  @media (max-width: 520px) {
    .flap-cell { width: 30px; height: 44px; border-radius: 4px; }
    .flap-cell .char { font-size: 22px; }
    .go-btn { padding: 16px 32px; font-size: 13px; }
    .wordmark { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flap-cell.flipping .char,
    .flap-cell.settled .char {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<main class="stage">
  <div class="header-badge">
    <span class="status-dot"></span> Autonomous Gate
  </div>
  
  <h1 class="wordmark">Departures</h1>
  <p class="tagline">Press the button to jump into a random AI chat.</p>

  <div class="board" role="group" aria-label="Departure board">
    <div class="board-header">
      <span class="board-label">Now Boarding</span>
      <span class="board-id">GATE-01</span>
    </div>
    <div class="flap-row" id="flapRow" aria-hidden="true"></div>
    <div class="board-caption" id="caption" aria-live="polite">10 characters · 14 possible destinations</div>
  </div>

  <div class="action">
    <button class="go-btn" id="goBtn" type="button">Take me there</button>
    <p class="fallback-link" id="fallback"></p>
    <p class="tally" id="tally"></p>
  </div>

  <details class="pool">
    <summary><span>Who's in the pool?</span></summary>
    <div class="pool-grid" id="poolGrid"></div>
  </details>

  <footer>
    <span>No account, no tracking, no memory of which one you got last time.</span>
    <a href="mailto:colm@aiaugmnetedreading.com" class="contact-btn">✉ Contact</a>
  </footer>
</main>

<script>
(function () {

  var DESTINATIONS = [
    { name: 'ChatGPT',    url: 'https://chatgpt.com/' },
    { name: 'Claude',     url: 'https://claude.ai/new' },
    { name: 'Gemini',     url: 'https://gemini.google.com/app' },
    { name: 'Grok',       url: 'https://grok.com/' },
    { name: 'Perplexity', url: 'https://www.perplexity.ai/' },
    { name: 'Copilot',    url: 'https://copilot.microsoft.com/' },
    { name: 'Mistral',    url: 'https://chat.mistral.ai/' },
    { name: 'Meta AI',    url: 'https://www.meta.ai/' },
    { name: 'DeepSeek',   url: 'https://chat.deepseek.com/' },
    { name: 'Poe',        url: 'https://poe.com/' },
    { name: 'Qwen',       url: 'https://chat.qwen.ai/' },
    { name: 'Kimi',       url: 'https://kimi.ai/' },
    { name: 'GLM',        url: 'https://chat.z.ai/' },
    { name: 'Arena',      url: 'https://arena.ai/' }
  ];

  var CELLS = 10;
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ ';
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var flapRow = document.getElementById('flapRow');
  var goBtn = document.getElementById('goBtn');
  var caption = document.getElementById('caption');
  var fallback = document.getElementById('fallback');
  var tallyEl = document.getElementById('tally');
  var poolGrid = document.getElementById('poolGrid');

  var cells = [];
  var idleTimer = null;
  var isRolling = false;

  function buildBoard() {
    for (var i = 0; i < CELLS; i++) {
      var cell = document.createElement('div');
      cell.className = 'flap-cell';
      var span = document.createElement('span');
      span.className = 'char';
      span.textContent = '·';
      cell.appendChild(span);
      flapRow.appendChild(cell);
      cells.push({ el: cell, span: span });
    }
  }

  function setChar(cellObj, ch) {
    cellObj.el.classList.remove('flipping');
    void cellObj.el.offsetWidth; // force reflow
    cellObj.el.classList.add('flipping');
    cellObj.span.textContent = ch;
  }

  function padName(name) {
    var upper = name.toUpperCase();
    var total = CELLS - upper.length;
    var left = Math.floor(total / 2);
    var right = total - left;
    return ' '.repeat(Math.max(left, 0)) + upper + ' '.repeat(Math.max(right, 0));
  }

  function randomLetter() {
    return LETTERS.charAt(Math.floor(Math.random() * LETTERS.length));
  }

  function buildPool() {
    DESTINATIONS.forEach(function (d) {
      var span = document.createElement('span');
      span.textContent = d.name;
      poolGrid.appendChild(span);
    });
  }

  function bumpTally() {
    var n = parseInt(localStorage.getItem('departuresCount') || '0', 10) + 1;
    localStorage.setItem('departuresCount', String(n));
    tallyEl.textContent = n === 1 ? 'First trip.' : 'Trip #' + n + '.';
  }

  function showTally() {
    var n = parseInt(localStorage.getItem('departuresCount') || '0', 10);
    if (n > 0) tallyEl.textContent = 'Trips so far: ' + n;
  }

  function roll() {
    if (isRolling) return;
    isRolling = true;
    clearInterval(idleTimer);

    goBtn.disabled = true;
    goBtn.textContent = 'Boarding…';
    caption.textContent = 'Selecting flight path…';
    fallback.innerHTML = '&nbsp;';

    var dest = DESTINATIONS[Math.floor(Math.random() * DESTINATIONS.length)];
    var target = padName(dest.name);

    if (reduceMotion) {
      cells.forEach(function (cellObj, i) { cellObj.span.textContent = target[i]; });
      land(dest);
      return;
    }

    var settleBase = 480;
    var settleStep = 85;
    var doneCount = 0;

    cells.forEach(function (cellObj, i) {
      var settleAt = settleBase + i * settleStep;

      var tickTimer = setInterval(function () {
        setChar(cellObj, randomLetter());
      }, 55);

      setTimeout(function () {
        clearInterval(tickTimer);
        setChar(cellObj, target[i]);
        cellObj.el.classList.remove('settled');
        void cellObj.el.offsetWidth;
        cellObj.el.classList.add('settled');
        doneCount++;
        if (doneCount === CELLS) {
          setTimeout(function () { land(dest); }, 120);
        }
      }, settleAt);
    });
  }

  function land(dest) {
    caption.innerHTML = 'Destination: <span class="name">' + dest.name + '</span>';
    goBtn.disabled = false;
    goBtn.textContent = 'Again →';
    fallback.innerHTML = 'If nothing opened, <a href="' + dest.url + '" target="_blank" rel="noopener">go to ' + dest.name + ' →</a>';
    bumpTally();

    window.open(dest.url, '_blank', 'noopener');
    isRolling = false;

    startIdle();
  }

  function idleFlicker() {
    if (isRolling) return;
    var i = Math.floor(Math.random() * CELLS);
    var cellObj = cells[i];
    if (cellObj.span.textContent.trim() === '') {
      setChar(cellObj, randomLetter());
      setTimeout(function () { setChar(cellObj, ' '); }, 900);
    }
  }

  function startIdle() {
    clearInterval(idleTimer);
    if (reduceMotion) return;
    idleTimer = setInterval(idleFlicker, 2600);
  }

  buildBoard();
  buildPool();
  showTally();
  startIdle();

  goBtn.addEventListener('click', roll);
})();
</script>

</body>
</html>
